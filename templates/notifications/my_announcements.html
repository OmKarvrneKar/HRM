{% extends "base.html" %}
{% block title %}Announcements{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Announcements</h1>
<div class="row g-3">
  {% for item in announcements %}
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h2 class="h5">{{ item.title }}</h2>
          <p class="text-muted small">{{ item.created_at|date:"Y-m-d" }}</p>
          <p>{{ item.body|linebreaksbr }}</p>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12"><p class="text-muted">No announcements.</p></div>
  {% endfor %}
</div>
{% endblock %}
