{% extends "base.html" %}
{% block title %}New group{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Edit group{% else %}New group{% endif %}</h1>
<div class="card">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary" type="submit">{% if object %}Save{% else %}Create group{% endif %}</button>
      <a class="btn btn-link" href="{% url 'projects:groups' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
