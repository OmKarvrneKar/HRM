{% extends "base.html" %}
{% block title %}Submit work log{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Submit work log</h1>
<div class="card">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
          <div class="col-md-6">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
      </div>
      <div class="mt-3">
        <button class="btn btn-primary" type="submit">Submit</button>
        <a class="btn btn-link" href="{% url 'projects:my_worklogs' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
