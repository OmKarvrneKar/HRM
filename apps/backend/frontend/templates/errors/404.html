{% extends "base.html" %}

{% block title %}Page Not Found — AI Samrat HRMS{% endblock %}

{% block content %}
<div class="container-fluid px-0 py-4 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 p-md-5 text-center shadow-sm border" style="max-width: 580px; border-radius: 16px;">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning-emphasis rounded-circle mb-3 mx-auto" style="width: 72px; height: 72px;">
            <i class="bi bi-search" style="font-size: 2rem;"></i>
        </div>
        <h3 class="fw-bold mb-2 text-dark">Page not found</h3>
        <p class="text-muted mb-4">The requested employee profile or page could not be found. Check the link or return to your dashboard.</p>
        <div>
            <a href="/" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-1"></i> Return to My Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
